<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Counter</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 30px; }
  .number { font-size: 60px; font-weight: bold; color: #4caf50; }
  .label { margin-top: 10px; }
</style>
</head>
<body>

<div class="number" id="count">...</div>
<div class="label">人が回答しました</div>

<script>
fetch("ここにGASのURL")
  .then(res => res.json())
  .then(data => {
    document.getElementById("count").textContent =
      data.count.toLocaleString();
  });
</script>

</body>
</html>
